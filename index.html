<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국어 맞춤법 150 퀴즈 암기장</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
        }
        .blank-box {
            transition: all 0.2s ease-in-out;
        }
        .blank-box.active {
            border-color: #4f46e5;
            background-color: #eef2ff;
            color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: #4f46e5; }
            50% { border-color: #818cf8; }
        }
        .blank-box.solved-correct {
            border-color: #10b981;
            background-color: #ecfdf5;
            color: #047857;
        }
        .blank-box.solved-wrong {
            border-color: #ef4444;
            background-color: #fef2f2;
            color: #b91c1c;
        }
        .key-badge {
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header & Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-spell-check text-indigo-600 text-2xl"></i>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">맞춤법 150 마스터</h1>
            </div>
            
            <!-- Mode Tabs -->
            <div class="flex items-center bg-slate-100 p-1 rounded-xl text-sm font-semibold">
                <button id="tab-all" onclick="changeMode('all')" class="px-3 py-1.5 rounded-lg text-indigo-600 bg-white shadow-sm transition-all">
                    전체 (<span id="cnt-all">150</span>)
                </button>
                <button id="tab-wrong" onclick="changeMode('wrong')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5">
                    <span>오답노트</span>
                    <span id="cnt-wrong" class="bg-rose-100 text-rose-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
                <button id="tab-bookmark" onclick="changeMode('bookmark')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5">
                    <span>즐겨찾기</span>
                    <span id="cnt-bookmark" class="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-2">
                <label class="flex items-center gap-2 text-xs font-semibold text-slate-600 cursor-pointer bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-lg hover:bg-slate-100">
                    <input type="checkbox" id="toggle-shuffle" onchange="toggleShuffle()" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <span>랜덤 섞기</span>
                </label>
                <button onclick="resetData()" title="진도 초기화" class="text-xs text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-100 h-2 relative overflow-hidden">
            <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-300 w-0"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-1 flex flex-col justify-center">

        <!-- Info / Empty State -->
        <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
            <i class="fa-solid fa-circle-check text-5xl text-emerald-500 mb-4"></i>
            <h2 id="empty-title" class="text-2xl font-bold text-slate-800 mb-2">모든 문제를 완료했습니다!</h2>
            <p id="empty-desc" class="text-slate-500 text-sm">오답노트가 비어 있습니다. 참 잘했어요!</p>
            <button onclick="changeMode('all')" class="mt-6 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-all shadow-md">
                전체 문제 풀어보기
            </button>
        </div>

        <!-- Quiz Card Box -->
        <div id="quiz-card" class="bg-white rounded-3xl border border-slate-200/80 shadow-xl p-6 sm:p-10 relative flex flex-col justify-between min-h-[380px]">
            
            <!-- Card Header: Number & Bookmark -->
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-2">
                    <span id="quiz-idx" class="bg-slate-900 text-white font-black text-xs px-2.5 py-1 rounded-md">Q.1</span>
                    <span id="mode-badge" class="bg-indigo-50 text-indigo-700 font-bold text-xs px-2.5 py-1 rounded-md border border-indigo-100">전체 모드</span>
                </div>
                <button id="btn-bookmark" onclick="toggleCurrentBookmark()" class="text-2xl text-slate-300 hover:text-amber-400 transition-colors">
                    <i class="fa-solid fa-star"></i>
                </button>
            </div>

            <!-- Quiz Statement Text -->
            <div class="my-auto py-4 text-center">
                <div id="sentence-container" class="text-2xl sm:text-3xl font-extrabold leading-relaxed text-slate-800 flex flex-wrap items-center justify-center gap-2 sm:gap-3">
                    <!-- Dynamic Sentence with Blanks -->
                </div>
            </div>

            <!-- Quiz Option Buttons Area -->
            <div class="mt-8 pt-6 border-t border-slate-100">
                <div class="text-xs text-center font-bold text-slate-400 uppercase tracking-wider mb-3">정답 선택하기 (키보드 1, 2, 3 또는 0)</div>
                <div id="options-container" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <!-- Dynamic Option Buttons -->
                </div>
            </div>

            <!-- Explanation / Result Toast (Shows on Answer) -->
            <div id="result-toast" class="hidden absolute left-4 right-4 bottom-4 bg-slate-900/95 text-white backdrop-blur-md rounded-2xl p-4 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-3 border border-slate-700 animate-bounce-short z-10">
                <div class="flex items-start gap-3">
                    <div id="toast-icon" class="text-2xl mt-0.5"></div>
                    <div>
                        <div id="toast-status" class="font-bold text-base flex items-center gap-2"></div>
                        <div id="toast-explanation" class="text-sm text-slate-300 font-medium mt-0.5"></div>
                    </div>
                </div>
                <button id="btn-next" onclick="nextQuestion()" class="w-full sm:w-auto px-5 py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-sm rounded-xl transition-all flex items-center justify-center gap-2 shrink-0 shadow-lg">
                    <span>다음 (Enter)</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

    </main>

    <!-- Footer Guide -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-6">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400 font-medium flex flex-wrap justify-center gap-4">
            <span><kbd class="px-1.5 py-0.5 bg-slate-100 border rounded font-mono text-slate-600">1</kbd> <kbd class="px-1.5 py-0.5 bg-slate-100 border rounded font-mono text-slate-600">2</kbd> 선택지</span>
            <span><kbd class="px-1.5 py-0.5 bg-slate-100 border rounded font-mono text-slate-600">0</kbd> / <kbd class="px-1.5 py-0.5 bg-slate-100 border rounded font-mono text-slate-600">Space</kbd> 복수표준어</span>
            <span><kbd class="px-1.5 py-0.5 bg-slate-100 border rounded font-mono text-slate-600">Enter</kbd> 다음 문제</span>
        </div>
    </footer>

    <!-- App Logic JavaScript -->
    <script>
        // 150 Full Dataset
        const rawQuizData = [

            { id: 2, text: "이 옷이 더 {0}하지?", options: ["문안", "무난"], answer: [1], note: "없을 무(無), 어려울 난(難)" },
            { id: 3, text: "오늘은 {0} 숙제 다 할 거야.", options: ["반드시", "반듯이"], answer: [0], note: "'꼭'의 뜻일 때는 '반드시'" },

        let wrongSet = new Set(JSON.parse(localStorage.getItem('spelling_wrong') || '[]'));
        let bookmarkSet = new Set(JSON.parse(localStorage.getItem('spelling_bookmark') || '[]'));

        window.addEventListener('DOMContentLoaded', () => {
            updateCounts();
            setupModeList();
            renderQuiz();

            // Keyboard Listeners
            window.addEventListener('keydown', handleKeyPress);
        });

        // Save State
        function saveStorage() {
            localStorage.setItem('spelling_wrong', JSON.stringify([...wrongSet]));
            localStorage.setItem('spelling_bookmark', JSON.stringify([...bookmarkSet]));
            updateCounts();
        }

        function updateCounts() {
            document.getElementById('cnt-all').innerText = rawQuizData.length;
            document.getElementById('cnt-wrong').innerText = wrongSet.size;
            document.getElementById('cnt-bookmark').innerText = bookmarkSet.size;
        }

        function setupModeList() {
            if (currentMode === 'all') {
                currentList = [...rawQuizData];
            } else if (currentMode === 'wrong') {
                currentList = rawQuizData.filter(q => wrongSet.has(q.id));
            } else if (currentMode === 'bookmark') {
                currentList = rawQuizData.filter(q => bookmarkSet.has(q.id));
            }

            if (isShuffled) {
                currentList.sort(() => Math.random() - 0.5);
            }

            currentIndex = 0;
        }

        function changeMode(mode) {
            currentMode = mode;
            
            // Tab Styling
            ['all', 'wrong', 'bookmark'].forEach(m => {
                const btn = document.getElementById(`tab-${m}`);
                if (m === mode) {
                    btn.className = "px-3 py-1.5 rounded-lg text-indigo-600 bg-white shadow-sm font-bold transition-all";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5";
                }
            });

            const modeNames = { all: '전체 모드', wrong: '오답노트 모드', bookmark: '즐겨찾기 모드' };
            modeBadge.innerText = modeNames[mode];

            setupModeList();
            renderQuiz();
        }

            isShuffled = document.getElementById('toggle-shuffle').checked;
            setupModeList();
            renderQuiz();
        }

        function resetData() {
            if (confirm('모든 오답노트와 즐겨찾기 기록을 초기화하시겠습니까?')) {
                wrongSet.clear();
                bookmarkSet.clear();
                saveStorage();
                setupModeList();
                renderQuiz();
            }
        }

        function toggleCurrentBookmark() {
            if (!currentList[currentIndex]) return;
            const qId = currentList[currentIndex].id;
            if (bookmarkSet.has(qId)) {
                bookmarkSet.delete(qId);
            } else {
                bookmarkSet.add(qId);
            }
            saveStorage();
            updateBookmarkButton(qId);
            if (currentMode === 'bookmark' && !bookmarkSet.has(qId)) {
                setupModeList();
                renderQuiz();
            }
        }

        function updateBookmarkButton(qId) {
            if (bookmarkSet.has(qId)) {
                btnBookmark.className = "text-2xl text-amber-400 hover:text-amber-500 transition-colors";
            } else {
                btnBookmark.className = "text-2xl text-slate-300 hover:text-amber-400 transition-colors";
            }
        }

        // Render Quiz Item
        function renderQuiz() {
            resultToast.classList.add('hidden');
            isQuestionAnswered = false;

            if (currentList.length === 0) {
                quizCard.classList.add('hidden');
                emptyState.classList.remove('hidden');
                
                if (currentMode === 'wrong') {
                    document.getElementById('empty-title').innerText = "오답노트 완파!";
                    document.getElementById('empty-desc').innerText = "모든 오답을 맞혀 오답노트에서 모두 제거되었습니다.";
                } else if (currentMode === 'bookmark') {
                    document.getElementById('empty-title').innerText = "즐겨찾기가 없습니다";
                    document.getElementById('empty-desc').innerText = "별 아이콘을 눌러 복습할 문제를 즐겨찾기에 담아보세요.";
                }
                progressBar.style.width = `100%`;
                return;
            }

            quizCard.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const item = currentList[currentIndex];
            quizIdxLabel.innerText = `Q.${item.id} (${currentIndex + 1}/${currentList.length})`;
            updateBookmarkButton(item.id);

            // Calculate progress
            const progress = ((currentIndex) / currentList.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Reset blank states
            activeBlankIndex = 0;
            userSelections = [];

            // Parse Sentence Blanks
            const sentenceParts = item.text.split(/\{(\d+)\}/);
            sentenceContainer.innerHTML = '';

            let blankCount = 0;
            sentenceParts.forEach((part, idx) => {
                if (idx % 2 === 1) { // It's a blank index placeholder
                    const blankIdx = parseInt(part);
                    blankCount++;

                    const blankBox = document.createElement('button');
                    blankBox.id = `blank-${blankIdx}`;
                    blankBox.className = `blank-box border-b-4 border-slate-300 px-3 py-1 min-w-[90px] font-bold text-slate-700 bg-slate-50 rounded-lg mx-1 inline-flex items-center justify-center cursor-default ${blankIdx === 0 ? 'active' : ''}`;
                    blankBox.innerText = `( 선택 ${blankIdx + 1} )`;
                    
                    sentenceContainer.appendChild(blankBox);
                } else {
                    const textNode = document.createElement('span');
                    textNode.innerText = part;
                    sentenceContainer.appendChild(textNode);
                }
            });

            renderOptions();
        }

        // Render Available Options for Active Blank
        function renderOptions() {
            const item = currentList[currentIndex];
            optionsContainer.innerHTML = '';

            // Get options array for the current active blank
            let opts = item.options;
            if (activeBlankIndex === 1 && item.options2) opts = item.options2;
            if (activeBlankIndex === 2 && item.options3) opts = item.options3;

            // Render Choice Buttons
            opts.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.onclick = () => selectOption(optIdx);
                btn.className = "flex items-center justify-between px-4 py-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl transition-all font-bold text-slate-800 text-left group shadow-sm";
                
                btn.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-lg bg-slate-200 text-slate-700 font-mono text-xs flex items-center justify-center key-badge group-hover:bg-indigo-600 group-hover:text-white transition-colors">${optIdx + 1}</span>
                        <span class="text-base">${optText}</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-300 group-hover:text-indigo-400"></i>
                `;
                optionsContainer.appendChild(btn);
            });

            // If item supports multiple standard words (복수표준어) or as alternative
            const isMultipleStandard = item.answer[0] === -1;
            const multiBtn = document.createElement('button');
            multiBtn.onclick = () => selectOption(-1);
            multiBtn.className = `flex items-center justify-between px-4 py-3 rounded-xl transition-all font-bold text-left shadow-sm ${
                isMultipleStandard 
                ? 'bg-amber-50 border border-amber-200 text-amber-900 hover:bg-amber-100' 
                : 'bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100'
            }`;

            multiBtn.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-amber-200 text-amber-800 font-mono text-xs flex items-center justify-center key-badge">0</span>
                    <span class="text-sm">복수표준어 (둘 다 가능)</span>
                </div>
                <i class="fa-solid fa-check text-xs text-amber-500"></i>
            `;
            optionsContainer.appendChild(multiBtn);
        }

        // Handle Option Selection
        function selectOption(selectedOptIdx) {
            if (isQuestionAnswered) return;

            const item = currentList[currentIndex];
            userSelections.push(selectedOptIdx);

            // Update UI for completed blank
            const curBlankBox = document.getElementById(`blank-${activeBlankIndex}`);
            if (curBlankBox) {
                curBlankBox.classList.remove('active');
                
                // Show chosen text
                let opts = item.options;
                if (activeBlankIndex === 1 && item.options2) opts = item.options2;
                if (activeBlankIndex === 2 && item.options3) opts = item.options3;

                curBlankBox.innerText = selectedOptIdx === -1 ? "복수표준어" : opts[selectedOptIdx];
            }

            // Check if there are more blanks
            activeBlankIndex++;
            const totalBlanks = item.answer.length;

            if (activeBlankIndex < totalBlanks) {
                // Focus next blank automatically
                const nextBlankBox = document.getElementById(`blank-${activeBlankIndex}`);
                if (nextBlankBox) {
                    nextBlankBox.classList.add('active');
                }
                renderOptions(); // Update options for next blank
            } else {
                // All blanks answered - evaluate correctness
                evaluateAnswer();
            }
        }

        // Evaluate Result
        function evaluateAnswer() {
            isQuestionAnswered = true;
            const item = currentList[currentIndex];
            
            let isCorrect = true;

            // Compare userSelections with item.answer
            for (let i = 0; i < item.answer.length; i++) {
                if (userSelections[i] !== item.answer[i]) {
                    isCorrect = false;
                    break;
                }
            }

            // Apply visual badges on blanks
            for (let i = 0; i < item.answer.length; i++) {
                const box = document.getElementById(`blank-${i}`);
                if (box) {
                    if (userSelections[i] === item.answer[i]) {
                        box.classList.add('solved-correct');
                    } else {
                        box.classList.add('solved-wrong');
                    }
                }
            }

            // Update local storage for wrong answers
            if (!isCorrect) {
                wrongSet.add(item.id);
            } else {
                // If answered correctly in 'wrong' mode, remove from wrongSet
                if (currentMode === 'wrong') {
                    wrongSet.delete(item.id);
                }
            }
            saveStorage();

            // Display Result Toast / Card
            const toastIcon = document.getElementById('toast-icon');
            const toastStatus = document.getElementById('toast-status');
            const toastExp = document.getElementById('toast-explanation');

            if (isCorrect) {
                toastIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i>`;
                toastStatus.className = "font-bold text-base text-emerald-400 flex items-center gap-2";
                toastStatus.innerText = "정답입니다!";
            } else {
                toastIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400"></i>`;
                toastStatus.className = "font-bold text-base text-rose-400 flex items-center gap-2";
                
                // Construct correct answer summary
                let correctStr = "";
                item.answer.forEach((ans, idx) => {
                    let opts = item.options;
                    if (idx === 1 && item.options2) opts = item.options2;
                    if (idx === 2 && item.options3) opts = item.options3;

                    const ansText = ans === -1 ? "복수표준어" : opts[ans];
                    correctStr += `${idx > 0 ? ' / ' : ''}${ansText}`;
                });

                toastStatus.innerText = `오답입니다! (정답: ${correctStr})`;
            }

            toastExp.innerText = item.note ? `💡 비고: ${item.note}` : '💡 올바른 맞춤법을 기억하세요!';
            resultToast.classList.remove('hidden');
        }

        // Advance to Next Question
        function nextQuestion() {
            if (currentList.length === 0) return;

            // If in wrong mode and standard question was correct, list size decreases
            if (currentMode === 'wrong' && !wrongSet.has(currentList[currentIndex]?.id)) {
                setupModeList();
                if (currentIndex >= currentList.length) {
                    currentIndex = 0;
                }
            } else {
                currentIndex++;
                if (currentIndex >= currentList.length) {
                    currentIndex = 0; // Loop back or complete
                }
            }

            renderQuiz();
        }

        // Global Key Press Shortcuts
        function handleKeyPress(e) {
            // Ignore shortcuts if result modal or inputs focused
            if (e.key === 'Enter') {
                if (isQuestionAnswered) {
                    e.preventDefault();
                    nextQuestion();
                }
                return;
            }

            if (isQuestionAnswered) return;

            if (e.key === '1') {
                selectOption(0);
            } else if (e.key === '2') {
                selectOption(1);
            } else if (e.key === '3') {
                const item = currentList[currentIndex];
                let opts = item.options;
                if (activeBlankIndex === 1 && item.options2) opts = item.options2;
                if (activeBlankIndex === 2 && item.options3) opts = item.options3;

                if (opts.length >= 3) {
                    selectOption(2);
                }
            } else if (e.key === '0' || e.key === ' ') {
                e.preventDefault();
                selectOption(-1); // 복수표준어
            }
        }
    </script>
</body>
</html>
